<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FireMessage — Автономный режим</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #000000;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: #111111;
      border: 1px solid #292929;
      border-radius: 20px;
      padding: 40px 32px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
    }
    .symbol {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 50%;
      border: 2px solid #8A8A8A;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
    }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; }
    p { font-size: 14px; color: #8A8A8A; line-height: 1.6; margin-bottom: 28px; }
    button {
      background: #FFFFFF;
      color: #000000;
      border: none;
      font-weight: 600;
      font-size: 14px;
      padding: 12px 28px;
      border-radius: 12px;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="card">
    <div class="symbol">⚡</div>
    <h1>Нет соединения с сетью</h1>
    <p>FireMessage работает в автономном режиме. Проверьте подключение к интернету для синхронизации сообщений и звонков.</p>
    <button onclick="window.location.reload()">Повторить попытку</button>
  </div>
</body>
</html>
