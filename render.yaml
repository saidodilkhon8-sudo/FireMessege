services:
  # FireMessage Web Service on Render (Full-Stack Node.js + Vite PWA)
  - type: web
    name: firemessage
    runtime: node
    plan: free
    region: frankfurt # or oregon, singapore
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
